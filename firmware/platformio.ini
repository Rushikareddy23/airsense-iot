; Build & flash:  pio run -e esp32dev -t upload   |   Serial monitor: pio device monitor
; Unit tests of the hardware-independent logic run on your computer:  make test  (needs g++)

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=1
lib_deps =
  256dpi/MQTT@^2.5.2                  ; supports QoS 1 (PubSubClient only does QoS 0)
  bblanchon/ArduinoJson@^7.2.0
  adafruit/Adafruit BME280 Library@^2.2.4
  adafruit/Adafruit SGP30 Sensor@^2.0.3
  adafruit/Adafruit Unified Sensor@^1.1.14
